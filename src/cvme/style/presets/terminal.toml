# Section headings set in the same monospace as the name.
#
# The one preset where the display face does more than sign the page: mono
# headings over a humanist sans read as an engineering document without any of
# the icon-and-sidebar furniture that breaks parsers. Teal is the accent
# because it survives greyscale; swap `accent` for another dark hue and the
# whole page follows.
[style]
# A tighter bullet gutter than the default. The marker only has to read as a
# marker; the width it gives back goes into the line, and a line that no longer
# wraps is worth more than the indent it cost.
marker_indent = 11.0
body_indent = 9.0
marker_size = 6.5

body_font = "Source Sans 3"
body_size = 10.75
leading = 5.4
ink = "#15181c"
accent = "#0f5f57"
muted = "#586069"

name_font = "Fira Code"
name_size = 18.5
name_tracking = -0.5
name_color = "#0f5f57"
contact_size = 10.0
header_gap = 12.0
link_underline = false
link_color = "#0f5f57"

section_font = "Fira Code"
section_size = 9.5
section_tracking = 0.4
section_gap_before = 10.0
section_gap_after = 5.0
section_rule = 0.9
section_rule_gap = 3.2

entry_gap_before = 6.2
date_size = 9.5
date_weight = "regular"
org_weight = "regular"
sub_weight = "regular"
