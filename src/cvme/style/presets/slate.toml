# One accent colour, used consistently.
#
# Navy on the name, the section headings, the rules and the links; black
# everywhere else. A single dark accent is the one colour move that survives
# both a greyscale print and a parser, and using it in four places rather than
# one is what makes it read as a decision.
[style]
# A tighter bullet gutter than the default. The marker only has to read as a
# marker; the width it gives back goes into the line, and a line that no longer
# wraps is worth more than the indent it cost.
marker_indent = 11.0
body_indent = 9.0
marker_size = 6.5

body_font = "Inter"
body_size = 10.0
leading = 5.05
ink = "#101418"
accent = "#1d3f6e"
muted = "#5b646e"

name_font = "Fira Code"
name_size = 18.5
name_tracking = -0.6
name_color = "#1d3f6e"
contact_size = 9.5
header_gap = 11.5
header_rule = 1.4
header_rule_gap = 5.5
link_underline = false
link_color = "#1d3f6e"

section_size = 10.0
section_tracking = 1.1
section_gap_before = 8.5
section_gap_after = 5.0
section_rule = 0.6
section_rule_gap = 3.0
section_rule_color = "#b9c4d2"

entry_gap_before = 5.2
date_size = 9.25
date_weight = "regular"
org_weight = "regular"
org_color = "#3d4a58"
sub_weight = "regular"
strong_color = "#101418"
