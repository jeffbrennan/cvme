# Modern sans, hairline separators, one weight of emphasis.
#
# The conservative pick: nothing on the page that a 2005 parser has not seen,
# and every device earning its keep. Bold marks roles and skill labels and
# nothing else; dates step back to grey and regular weight so the left edge
# reads as one column of names rather than a wall of bold.
[style]
# A tighter bullet gutter than the default. The marker only has to read as a
# marker; the width it gives back goes into the line, and a line that no longer
# wraps is worth more than the indent it cost.
marker_indent = 11.0
body_indent = 9.0
marker_size = 6.5

body_font = "IBM Plex Sans"
body_size = 10.5
leading = 5.15
ink = "#111111"
accent = "#111111"
muted = "#5a5a5a"

name_font = "Fira Code"
name_size = 19.0
name_tracking = -0.4
contact_size = 10.0
header_gap = 12.0
link_underline = false

section_size = 10.5
section_tracking = 1.0
section_gap_before = 9.5
section_gap_after = 5.0
section_rule = 0.6
section_rule_gap = 3.0
section_rule_color = "#bdbdbd"

entry_gap_before = 5.4
date_size = 9.5
date_weight = "regular"
org_weight = "regular"
sub_weight = "regular"
entry_weight = "bold"
