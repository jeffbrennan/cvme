# Density first: the most bullets that stay comfortable on one page.
#
# Narrower margins and a tighter rhythm than the other presets, on the face
# that sets most economically of the six. Use it when a role deserves a bullet
# the page would otherwise refuse.
[style]
# A tighter bullet gutter than the default. The marker only has to read as a
# marker; the width it gives back goes into the line, and a line that no longer
# wraps is worth more than the indent it cost.
marker_indent = 11.0
body_indent = 9.0
marker_size = 6.5

body_font = "Source Sans 3"
body_size = 10.6
leading = 5.6
margin_x = 50.4          # 0.7in
margin_y = 40.0
ink = "#111111"
accent = "#111111"
muted = "#565656"

name_font = "Fira Code"
name_size = 17.5
name_tracking = -0.5
contact_size = 9.5
header_gap = 11.5
link_underline = false

section_size = 10.0
section_tracking = 1.0
section_gap_before = 9.0
section_gap_after = 4.0
section_rule = 0.5
section_rule_gap = 2.6
section_rule_color = "#c0c0c0"

entry_gap_before = 6.0
date_size = 9.25
date_weight = "regular"
org_weight = "regular"
sub_weight = "regular"
