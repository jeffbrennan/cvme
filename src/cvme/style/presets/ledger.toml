# Editorial serif. Reads as a document rather than a form.
#
# Source Serif 4 is a text face built for screens as well as print, so the
# bullets stay legible at 10.5pt where a display serif would not. The name is
# JetBrains Mono: the monospace against the serif is the only contrast the page
# needs, which is why the section headings stay quiet.
[style]
# A tighter bullet gutter than the default. The marker only has to read as a
# marker; the width it gives back goes into the line, and a line that no longer
# wraps is worth more than the indent it cost.
marker_indent = 11.0
body_indent = 9.0
marker_size = 6.5

body_font = "Source Serif 4"
body_size = 10.25
leading = 5.05
ink = "#14171a"
accent = "#14171a"
muted = "#5c6670"

name_font = "JetBrains Mono"
name_size = 18.0
name_tracking = -0.5
contact_size = 9.75
header_gap = 11.0
header_rule = 0.8
header_rule_gap = 5.0
header_rule_color = "#14171a"
link_underline = false

section_size = 9.75
section_tracking = 1.6
section_gap_before = 8.5
section_gap_after = 4.5
section_rule = 0.5
section_rule_gap = 3.0
section_rule_color = "#c4ccd4"

entry_gap_before = 5.2
date_size = 9.25
date_weight = "regular"
org_weight = "regular"
sub_weight = "regular"
