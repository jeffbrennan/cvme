# The sans family. One accent, mono headings, hairline separators.
#
# The hierarchy is built from four things and no more: a monospace display
# face for the name and the section headings, a rule under the letterhead, a
# hairline under each section heading, and bold on roles and skill labels
# only. Dates and organisations step back -- grey and regular for the dates,
# italic for the organisation, which is what separates it from the bullet
# directly beneath when both are regular weight.
#
# `accent` is the whole colour scheme: the name, the section headings, the
# letterhead rule and the links all take it. It ships as near-black, so the
# document is monochrome until someone asks for otherwise:
#
#     cvme render base --style sans --accent navy
#     cvme render base --style sans --accent '#8a1538'
[style]
body_font = "Source Sans 3"
body_size = 10.75
leading = 5.4
ink = "#16191d"
accent = "#16191d"
muted = "#586069"

# A tighter bullet gutter than the default. The marker only has to read as a
# marker; the width it gives back goes into the line, and a line that no longer
# wraps is worth more than the indent it cost.
marker_indent = 11.0
body_indent = 9.0
marker_size = 6.5

name_font = "Fira Code"
name_size = 18.5
name_tracking = -0.5
contact_size = 10.0
header_gap = 11.0
header_rule = 1.2
header_rule_gap = 5.0
link_underline = false

section_font = "Fira Code"
section_size = 9.5
section_tracking = 0.4
section_gap_before = 9.5
section_gap_after = 5.0
# Lighter and thinner than the letterhead's: this one separates, it does not
# announce. Grey rather than the accent, so a strong accent does not turn four
# hairlines into four coloured bars.
section_rule = 0.7
section_rule_gap = 3.0
section_rule_color = "#a9b1b9"

entry_gap_before = 6.0
date_size = 9.5
date_weight = "regular"
org_weight = "regular"
org_style = "italic"
sub_weight = "regular"
