# What a posting says about the hours, read as signals rather than adjectives.
#
# Every entry is a phrase a posting might use, what that phrase reliably
# predicts about the week, and what it is worth. A cost subtracts from the
# baseline; a lift adds to it. Nothing here is a judgement about the company:
# it is a reading of the words the company chose to advertise with, which is
# the only evidence available before an interview.
#
# `phrases` are matched on whole normalised tokens, so "lean" does not match
# "learning" and "996" does not match a phone number. A phrase this field uses
# for its systems rather than its hours -- "24/7", "asynchronous", "high
# velocity" -- is deliberately not here, because a pipeline that runs all night
# is not the same claim as a person who does. A phrase counts once
# however many times it appears -- boilerplate repeated three times is one
# statement, not three -- so weight is the only thing that decides severity.
#
# Extend it for your own tolerances with [culture] extra_costs and
# extra_lifts in cvme.toml.

# -- Costs --------------------------------------------------------------------

[[cost]]
term = "996"
weight = 25
says = "the 9am-to-9pm, six-day week, named outright"
phrases = ["996", "996 culture", "9 9 6"]

[[cost]]
term = "always on"
weight = 18
says = "availability outside hours, stated as a virtue"
# "24/7" and "around the clock" are deliberately absent: in this field they
# describe the pipeline, not the person reading the posting.
phrases = [
  "always on", "nights and weekends", "evenings and weekends", "weekend work",
  "after hours support", "whenever the business needs",
]

