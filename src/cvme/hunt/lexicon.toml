# The vocabulary a fit score is computed over.
#
# A posting's requirements are only measurable against a fixed vocabulary:
# without one, a term the posting asks for and the corpus lacks is invisible,
# and "missing" -- the useful half of the score -- cannot be reported at all.
#
# Each entry is a canonical name mapped to the spellings that mean it. Matching
# is on whole normalised tokens, so "go" does not match "golang tutorial" via
# substring and "r" does not match every word containing one.
#
# Extend it for your own field with [fit] extra_terms in cvme.toml.

