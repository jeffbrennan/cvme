[project]
name = "cvme"
dynamic = ["version"]
description = "Typeset resumes and cover letters from markdown."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "src/cvme/render/fonts/LICENSE.*"]
authors = [{ name = "Jeff Brennan", email = "jeffbrennan10@gmail.com" }]
keywords = ["resume", "cv", "cover-letter", "markdown", "typst", "pdf", "ats"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "markdown-it-py>=3.0",
    "typst>=0.13",
    "pyyaml>=6.0",
    "pypdf>=5.0",
    "rich>=13.0",
    "httpx>=0.28",
    "pdfplumber>=0.11",
    "html2text>=2025.4",
    "selectolax>=0.3.30",
]

[project.urls]
Homepage = "https://github.com/jeffbrennan/cvme"
Repository = "https://github.com/jeffbrennan/cvme"
Issues = "https://github.com/jeffbrennan/cvme/issues"

[project.scripts]
cvme = "cvme.cli.app:main"

[project.optional-dependencies]
browser = [
    "playwright>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "pyrefly>=1.0",
    "fonttools[woff]>=4.55",
]

[build-system]
# 1.27 is where hatchling learned PEP 639 `license`/`license-files`.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/cvme/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cvme"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/scripts", "/README.md"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# En dash is domain content here: it separates date ranges and the role from
# the organisation. Em dash is deliberately not allowed -- the generated-prose
# rules ban it.
allowed-confusables = ["\u2013"]

[tool.pyrefly]
project-includes = ["src", "tests"]
# The repo root as well as src/, so `tests.geometry` resolves; pyrefly infers
# only src/ from the project layout.
search-path = ["src", "."]
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.isort]
known-first-party = ["cvme", "tests"]
